<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="hmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fundo Arredondado com Gradiente Médico -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#hmGrad)" filter="url(#hmShadow)" />

  <!-- Silhueta da Casa (Home) com Telhado -->
  <path d="M32 12 L15 26 L20 26 L20 48 C20 49.6 21.4 51 23 51 L41 51 C42.6 51 44 49.6 44 48 L44 26 L49 26 Z" 
        fill="#ffffff" 
        opacity="0.22" />

  <!-- Cruz Médica HomeMed Centralizada -->
  <!-- Barra Vertical -->
  <rect x="27.5" y="20" width="9" height="26" rx="4.5" fill="#ffffff" />
  <!-- Barra Horizontal -->
  <rect x="19" y="28.5" width="26" height="9" rx="4.5" fill="#ffffff" />

  <!-- Ponto de Batimento Cardíaco / Pulse Vital -->
  <circle cx="32" cy="33" r="3" fill="url(#hmGrad)" />
</svg>